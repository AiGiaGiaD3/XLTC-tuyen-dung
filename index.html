<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ED1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hiểu điều ứng viên băn khoăn</title>
<style>
:root{
  --red:#ED1B2E;--red-d:#B5121F;--red-l:#FDE8EA;
  --ink:#1D1D1F;--ink2:#3A3B40;--gray:#6E6E73;--line:#E5E5EA;--bg:#F5F5F7;
  --ok:#1E9E5A;--ok-l:#E4F5EC;--mid:#E58A00;--mid-l:#FFF1DC;--no:#C8102E;--no-l:#FDE8EA;
  --sh1:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
  --sh2:0 4px 10px rgba(0,0,0,.06),0 24px 48px rgba(0,0,0,.12);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --g:#ED1B2E;--gd:#B5121F;--gl:#FDE8EA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background .4s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,.input:focus-visible{outline:3px solid #0A66C2;outline-offset:3px}
img{-webkit-user-drag:none}
html,body{overscroll-behavior-y:none;overflow-x:hidden}
main{overflow-x:hidden;overflow-x:clip}
.fcard,.bcard{-webkit-user-select:none;user-select:none}
.preview img{-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.scr{-webkit-user-select:text;user-select:text}
.bar{position:sticky;top:0;z-index:50;padding:calc(10px + var(--st)) 16px 10px;background:rgba(245,245,247,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
body.redmode .bar{display:none}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--sh1);flex:none}
.ib svg{width:18px;height:18px}
.bar-t{flex:1;min-width:0;text-align:center}
.bar-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t small{display:block;font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;justify-content:center;margin-top:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:#D1D1D6;transition:all .3s}
.dots i.on{width:18px;background:var(--red)}
.dots i.done{background:#F4A3AB}
.spacer{width:40px;flex:none}
main{max-width:620px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) calc(160px + var(--sb)) max(16px,env(safe-area-inset-right))}
.view{animation:vin .45s cubic-bezier(.2,.8,.2,1)}
.view.back{animation:vback .45s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes vback{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
h2{font-size:clamp(24px,6.2vw,32px);line-height:1.15;letter-spacing:-.02em;margin:4px 0 6px}
.lead{color:var(--gray);margin:0 0 18px;font-size:16px}
.q-head{margin:6px 2px 18px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16.5px;transition:transform .15s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.96)}
.btn svg{width:19px;height:19px}
.b-pri{background:var(--red);color:#fff;box-shadow:0 10px 24px rgba(237,27,46,.28)}
.b-dark{background:linear-gradient(160deg,#C8102E,#9E0A16);color:#fff;box-shadow:0 10px 24px rgba(158,10,22,.28)}
.b-ghost{background:#fff;color:var(--ink);box-shadow:var(--sh1)}
.full{width:100%}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(14px + var(--sb));background:linear-gradient(rgba(245,245,247,0),rgba(245,245,247,.95) 30%);animation:dock .4s cubic-bezier(.2,.8,.2,1)}
@keyframes dock{from{transform:translateY(100%)}to{transform:none}}
.dock-in{max-width:620px;margin:0 auto;display:grid;gap:10px}
.dock-in.two{grid-template-columns:1fr 1fr}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .55s ease-out;background:rgba(255,255,255,.45);pointer-events:none}
.b-ghost .ripple,.opt .ripple,.mode-w .ripple{background:rgba(0,0,0,.08)}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* ===== HOME (full red) ===== */
body.redmode{background:#D7101F}
.home{position:relative;min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding-top:calc(14px + var(--st));color:#fff}
.home-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 85% -10%,#FF4A57 0%,rgba(255,74,87,0) 60%),radial-gradient(90% 60% at -10% 110%,#9E0A16 0%,rgba(158,10,22,0) 60%),linear-gradient(165deg,#ED1B2E 0%,#C8102E 100%);overflow:hidden}
.home-bg i{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.home-bg i:nth-child(1){width:520px;height:520px;right:-260px;top:-200px}
.home-bg i:nth-child(2){width:360px;height:360px;right:-180px;top:-120px;background:rgba(255,255,255,.04)}
.home-bg i:nth-child(3){width:300px;height:300px;left:-170px;bottom:-110px}
.logo-wrap{display:flex;justify-content:center;margin-top:6px}
.logo{width:clamp(150px,44vw,196px);aspect-ratio:1;border-radius:44px;overflow:hidden;box-shadow:0 0 0 6px rgba(255,255,255,.95),0 0 0 14px rgba(255,255,255,.16),0 28px 60px rgba(90,0,8,.45);animation:logoIn .9s cubic-bezier(.2,1.3,.4,1) both, floaty 5s ease-in-out 1s infinite}
.logo img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes logoIn{from{transform:scale(.4) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{50%{transform:translateY(-6px)}}
.gtitle{text-align:center;margin:26px 0 22px;animation:vin .6s .15s both}
.gtitle .tag{display:inline-block;background:#fff;color:var(--red);font-size:11.5px;font-weight:800;letter-spacing:.2em;padding:6px 14px;border-radius:999px}
.gtitle h1{font-size:clamp(32px,9vw,48px);line-height:1.06;letter-spacing:-.025em;margin:12px 0 0;font-weight:800;text-shadow:0 4px 18px rgba(90,0,8,.25)}
.steps-h{display:grid;grid-template-columns:repeat(4,1fr);max-width:400px;margin:0 auto;padding:10px 6px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);animation:vin .6s .25s both;position:relative}
.steps-h .s{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;text-align:center;line-height:1.15}
.steps-h .s .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--red);font-size:0;position:relative;z-index:1}
.steps-h .s .ic svg{width:16px;height:16px}
.steps-h .s:not(:last-child):after{content:"";position:absolute;top:15px;left:calc(50% + 19px);right:calc(-50% + 19px);height:2px;background:rgba(255,255,255,.45);border-radius:2px}
.steps-h .ar{display:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px;animation:vin .6s .35s both}
.mode-w{container-type:inline-size;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;border-radius:26px;padding:16px 14px 16px;min-height:168px;transition:transform .18s}
.mode-w:active{transform:scale(.97)}
.mode-w .mi{width:clamp(52px,14vw,64px);height:clamp(52px,14vw,64px);border-radius:18px;display:grid;place-items:center}
.mode-w .mi svg{width:32px;height:32px}
.mode-w b{font-size:clamp(22px,6.2vw,30px);font-size:clamp(24px,15cqw,34px);line-height:1.12;letter-spacing:-.02em;margin-top:auto;font-weight:800}
.mode-w .ar2{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.m1{background:#fff;color:var(--ink);box-shadow:0 14px 30px rgba(90,0,8,.25)}
.m1 .mi{background:var(--red-l);color:var(--red)}.m1 .ar2{background:var(--red);color:#fff}
.m2{background:#FFE3E6;color:#7A0B15;box-shadow:0 14px 30px rgba(90,0,8,.25)}
.m2 .mi{background:#fff;color:var(--red)}.m2 .ar2{background:#B5121F;color:#fff}

/* option lists */
.opts{display:grid;gap:12px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;text-align:left;background:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .2s}
.opt:active{transform:scale(.975)}
@media (hover:hover) and (pointer:fine){.opt:hover,.mode-w:hover{box-shadow:var(--sh2);transform:translateY(-2px)}}
.opt .oi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;background:var(--gl);color:var(--g);font-weight:800;font-size:22px}
.opt .oi svg{width:28px;height:28px}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:17.5px;line-height:1.3}
.opt .ot span{display:block;font-size:14px;color:var(--gray);line-height:1.4;margin-top:2px}
.opt .chev{color:#C7C7CC;flex:none}
.opt.sel{box-shadow:inset 0 0 0 2.5px var(--g),var(--sh1)}
.role-opt{flex-direction:column;align-items:flex-start;padding:22px;gap:12px}
.role-opt .oi{width:64px;height:64px;border-radius:20px}
.role-opt .ot b{font-size:22px}
.role-opt.r-ql{--g:#1F3A68;--gl:#E6ECF5}
.role-opt.r-uv{--g:#ED1B2E;--gl:#FDE8EA}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#F1F1F4;color:var(--ink2)}
.tagline{display:flex;gap:6px;flex-wrap:wrap}
.time-opt{justify-content:space-between}
.opt .ot .big,.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.opt .ot .big small,.big small{font-size:16px;font-weight:700;color:var(--gray);margin-left:4px;letter-spacing:0}
.grp-opt{padding:0;overflow:hidden;align-items:stretch}
.grp-opt .gside{width:92px;flex:none;background:linear-gradient(160deg,var(--g),var(--gd));color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px 0}
.grp-opt .gside i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.85}
.grp-opt .gside b{font-size:38px;line-height:1;font-weight:800}
.grp-opt .gside svg{width:34px;height:34px}
.grp-opt .ot{padding:16px 0;align-self:center}
.grp-opt .side-r{display:flex;align-items:center;gap:6px;padding-right:14px}
.cnt-due{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--red-l);color:var(--red-d);white-space:nowrap}
.card-opt{padding:14px 16px;gap:14px;border-radius:20px}
.card-opt .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--g);flex:none;font-size:16px}
.card-opt .ot b{font-size:16px;font-weight:600}
.done-note{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh1);margin-bottom:14px;font-size:14px;color:var(--ink2)}
.done-note .gdots{display:flex;gap:6px}
.done-note .gdots i{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;opacity:.25}
.done-note .gdots i.on{opacity:1}
/* flashcard front */
.fcard{position:relative;overflow:hidden;border-radius:30px;padding:20px 20px 22px;color:#fff;background:linear-gradient(160deg,var(--g) 0%,var(--gd) 100%);box-shadow:0 22px 48px rgba(0,0,0,.18);min-height:min(64vh,540px);display:flex;flex-direction:column}
.fcard .deco1{position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(255,255,255,.16)}
.fcard .deco2{position:absolute;left:-60px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.1)}
.fcard .grid{position:absolute;right:28px;top:190px;width:70px;height:46px;background-image:radial-gradient(rgba(255,255,255,.35) 1.4px,transparent 1.6px);background-size:12px 12px;opacity:.7}
.fcard > *{position:relative;z-index:1}
.fc-brand{text-align:center;background:#fff;color:var(--g);font-size:11.5px;font-weight:800;letter-spacing:.16em;padding:8px 10px;border-radius:999px}
.fc-grp{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.fc-grp b{background:#fff;color:var(--g);font-size:11px;letter-spacing:.06em;padding:3px 9px;border-radius:999px}
.fc-mid{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.fc-mid .lab{font-size:12px;font-weight:800;letter-spacing:.2em;opacity:.9}
.fc-mid .num{font-size:72px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.fc-ic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:0 0 0 12px rgba(255,255,255,.07)}
.fc-ic > span{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;border:2.5px solid rgba(255,255,255,.85)}
.fc-ask{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-style:italic;font-weight:600}
.fc-ask i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:rgba(255,255,255,.22)}
.fc-quote{margin-top:12px;flex:1;display:flex;align-items:center;border-radius:22px;padding:22px 20px 22px 26px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);position:relative}
.fc-quote:before{content:"";position:absolute;left:14px;top:20px;bottom:20px;width:4px;border-radius:3px;background:#fff}
.fc-quote p{margin:0;font-size:clamp(23px,6vw,30px);font-weight:800;line-height:1.28;letter-spacing:-.01em}
.fc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.18em}
.fc-foot span:last-child{letter-spacing:0;font-weight:600;opacity:.85;display:flex;gap:6px;align-items:center}
/* back */
.bcard{border-radius:30px;padding:10px;background:linear-gradient(160deg,var(--g),var(--gd));box-shadow:0 22px 48px rgba(0,0,0,.16)}
.bcard-in{background:#fff;border-radius:22px;padding:18px 16px 16px}
.bc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bc-tag{background:var(--g);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;padding:5px 12px;border-radius:999px}
.bc-q{margin:8px 0 6px;font-style:italic;color:var(--gray);font-size:15px}
.st{position:relative;display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0}
.st:not(:last-child):after{content:"";position:absolute;left:14px;top:42px;bottom:-12px;width:2px;background:var(--gl)}
.st .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;font-weight:800;font-size:14px;position:relative;z-index:1}
.st h4{margin:3px 0 2px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.st .hint{font-size:13.5px;color:var(--gray);margin:0 0 6px;line-height:1.4}
.st .scr{font-size:16px;line-height:1.55}
.st .ctx{display:inline-block;font-size:12px;font-weight:700;color:var(--gray);background:#F1F1F4;border-radius:999px;padding:2px 9px;margin-bottom:4px}
.ph{background:#FFF0C2;color:#7A4B00;border-radius:6px;padding:0 5px;font-weight:600}
.wait{display:block;margin-top:4px;font-size:13px;color:var(--gray);font-style:italic}
.bc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:12px;border-top:1px dashed var(--line);font-size:11.5px;font-weight:800;letter-spacing:.14em}
.bc-foot span:first-child{color:var(--red)}
.bc-foot span:last-child{color:var(--g);letter-spacing:.06em}
.more{margin-top:12px;border-radius:18px;background:#fff;box-shadow:var(--sh1);overflow:hidden}
.more > button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700;font-size:15px}
.more > button svg{transition:transform .25s}
.more.open > button svg{transform:rotate(180deg)}
.more .mv{display:none;padding:0 14px 14px;gap:8px}
.more.open .mv{display:grid;animation:vin .3s}
.xb{border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.5}
.xb b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.xb.n{background:#FFF5E5}.xb.n b{color:#9A5B00}
.xb.d{background:#EAF2FB}.xb.d b{color:#0A66C2}
.xb.o{background:var(--gl)}.xb.o b{color:var(--g)}
.xb.m{background:#F1F1F4}.xb.m b{color:var(--ink2)}
.flipwrap{perspective:1600px}
.flipper{transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{position:relative;overflow:hidden;border-radius:18px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;transition:transform .15s}
.rate:active{transform:scale(.94)}
.rate small{font-size:11.5px;font-weight:600;opacity:.8}
.r1{background:#FDE8EA;color:#B5121F}.r2{background:#FFF1DC;color:#9A5B00}.r3{background:#E4F5EC;color:#14713F}.r4{background:#EAF2FB;color:#0A66C2}
.dock-q{text-align:center;font-size:12.5px;color:var(--gray);font-weight:700}
.prog{height:5px;border-radius:5px;background:#E3E3E8;overflow:hidden;margin:2px 0 14px}
.prog i{display:block;height:100%;background:var(--red);transition:width .4s}
.ready{text-align:center;padding-top:6px}
.ready .rbadge{width:96px;height:96px;margin:6px auto 14px;border-radius:30px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--g),var(--gd));box-shadow:0 18px 36px rgba(0,0,0,.18)}
.ready .rbadge svg{width:46px;height:46px}
.ready ol{text-align:left;background:#fff;border-radius:22px;padding:16px 16px 16px 40px;box-shadow:var(--sh1);margin:16px 0 0;font-size:15.5px;line-height:1.55}
.ready ol li{margin:4px 0}
.summary-pill{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.timer{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 12px 10px 10px;box-shadow:var(--sh1);margin-bottom:12px}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#EFEFF2}.ring .fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.timer .tt{flex:1;min-width:0}.timer .tt b{font-size:14.5px;display:block}.timer .tt small{color:var(--gray);font-size:12.5px}
.timer .tb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
.timer .tb svg{width:18px;height:18px}
.timer.warn .fg{stroke:var(--mid)}.timer.over .fg{stroke:var(--no)}.timer.over b{color:var(--no)}
.rolebar{display:flex;margin-bottom:10px}
.rolebar .rb{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:6px 12px 6px 6px;border-radius:999px;background:#fff;box-shadow:var(--sh1)}
.rolebar .rb i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#1F3A68;font-style:normal}
.rolebar .rb.uv i{background:var(--red)}
.rolebar .rb i svg{width:15px;height:15px}
/* tri-state – distinct colours */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tri button{position:relative;overflow:hidden;min-height:48px;border-radius:14px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.15;padding:4px 6px;text-align:center;transition:all .2s;border:2px solid transparent}
.tri button svg{width:16px;height:16px;flex:none}
.tri button:active{transform:scale(.95)}
.tri .t2{background:var(--ok-l);color:#14713F;border-color:#BFE6CF}
.tri .t1{background:var(--mid-l);color:#9A5B00;border-color:#F6D8A8}
.tri .t0{background:var(--no-l);color:var(--no);border-color:#F6C3CA}
.tri .t2.on{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 6px 14px rgba(30,158,90,.32)}
.tri .t1.on{background:var(--mid);color:#fff;border-color:var(--mid);box-shadow:0 6px 14px rgba(229,138,0,.32)}
.tri .t0.on{background:var(--no);color:#fff;border-color:var(--no);box-shadow:0 6px 14px rgba(200,16,46,.32)}
.tri.has button:not(.on){opacity:.55}
.st.marked .n{animation:popn .4s}
@keyframes popn{50%{transform:scale(1.25)}}
.ql-hint{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;font-size:14px;color:var(--gray);font-weight:600}
.sumcard{background:#fff;border-radius:26px;box-shadow:var(--sh1);overflow:hidden}
.sum-head{padding:18px;color:#fff;background:linear-gradient(160deg,var(--g),var(--gd));position:relative;overflow:hidden}
.sum-head:after{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.sum-head small{font-size:11.5px;font-weight:800;letter-spacing:.14em;opacity:.85}
.sum-head .sq{font-size:19px;font-weight:800;line-height:1.3;margin-top:6px}
.score{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.score .sc{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.score .sc small{font-size:18px;color:var(--gray)}
.score .lv{font-weight:800;font-size:16px}
.score .lv span{display:block;font-size:13px;color:var(--gray);font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px}
table.tb td{padding:12px 18px;border-bottom:1px solid #F0F0F3}
table.tb td:first-child{font-weight:700}
table.tb td:first-child i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;margin-right:8px}
table.tb td:last-child{text-align:right}
.chip{display:inline-block;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.c2{background:var(--ok-l);color:#14713F}.c1{background:var(--mid-l);color:#9A5B00}.c0{background:var(--no-l);color:var(--no)}
.fbk{padding:14px 18px;font-size:14.5px;display:grid;gap:8px}
.fbk div b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.fbk p{margin:0;white-space:pre-line}
.preview img{display:block;width:100%;height:auto;border-radius:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin:0 4px 7px}
.input{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;padding:13px 15px;font-size:16px;outline:none;transition:border .2s,box-shadow .2s;resize:vertical}
.input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(237,27,46,.12)}
textarea.input{min-height:150px;line-height:1.5}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 2px 10px}
.sugg button{position:relative;overflow:hidden;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
.sugg button:active{transform:scale(.95)}
.center{text-align:center}
.big-ok{width:96px;height:96px;border-radius:30px;margin:10px auto 16px;display:grid;place-items:center;background:linear-gradient(160deg,#ED1B2E,#B5121F);color:#fff;box-shadow:0 18px 36px rgba(237,27,46,.3);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.big-ok svg{width:46px;height:46px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(120px + var(--sb));transform:translate(-50%,20px);background:#9E0A16;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.linkbtn{font-size:14px;font-weight:700;color:var(--gray);padding:10px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:370px){.fc-mid .num{font-size:58px}.fc-ic{width:80px;height:80px}.fc-ic>span{width:56px;height:56px}.tri button{font-size:11.5px}.rate{font-size:13.5px}}
@media (max-height:720px){.logo{width:clamp(110px,30vw,150px);border-radius:34px}.gtitle{margin:18px 0 16px}.gtitle h1{font-size:clamp(28px,8vw,40px)}.modes{margin-top:18px}.mode-w{min-height:140px}}
@media (max-height:500px) and (orientation:landscape){.home{padding-top:8px}.logo{width:84px;border-radius:24px;box-shadow:0 0 0 4px rgba(255,255,255,.95),0 12px 30px rgba(90,0,8,.4)}.gtitle{margin:10px 0 10px}.gtitle .tag{display:none}.gtitle h1{font-size:26px}.gtitle h1 br{display:none}.modes{margin-top:12px}.mode-w{min-height:0;flex-direction:row;align-items:center;padding:12px 56px 12px 12px}.mode-w b{margin-top:0;font-size:22px}.mode-w b br{display:none}.mode-w .ar2{top:50%;transform:translateY(-50%)}.modes{width:100%;max-width:620px;margin-left:auto;margin-right:auto}.mode-w .mi{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const GCOLOR = {1:{c:"#ED1B2E",d:"#B5121F",l:"#FDE8EA"},2:{c:"#1F3A68",d:"#14284A",l:"#E6ECF5"},3:{c:"#00756C",d:"#00544D",l:"#DFF2EF"},4:{c:"#B06A00",d:"#7E4C00",l:"#FBF0DF"}};
const CARDS = [
{id:1,g:1,q:"Tôi rất bận, không có thời gian.",s:[
["Ghi nhận trung tính quỹ thời gian đang chặt; không khen xã giao.","Mình hiểu, quỹ thời gian của bạn đang khá chặt. Vậy mình cùng nhìn vào lịch thực tế của bạn để tìm cách sắp xếp hợp lý nhất nhé."],
["Hỏi số giờ thực tế mỗi tuần có thể dành ra và điều đang chiếm nhiều thời gian nhất.","Mỗi tuần bạn có thể dành ra khoảng bao nhiêu giờ? Và hiện giờ việc gì đang chiếm nhiều thời gian của bạn nhất?"],
["Đặt số giờ của ứng viên cạnh lịch hoạt động tuần mẫu đang áp dụng; nói rõ nếu chưa đủ.","Đây là lịch hoạt động mẫu một tuần của người mới. Mình thử đặt [số giờ ứng viên có] vào đây xem nhé: nếu chưa đủ, chúng ta có thể cùng xem xét lại."],
["Tóm tắt kết quả vừa cùng sắp xếp; chốt bằng câu hỏi mở: trao đổi và hỏi ứng viên cần thêm thông tin gì.","(Sau 20 phút) Chúng ta vừa cùng xem xét và sắp xếp thời gian của bạn phù hợp với lịch hoạt động tuần. Bạn có cần thêm thông tin gì để cân nhắc không?"]],
n:"Câu mở đầu nói chân thành, không như khen xã giao. Ở bước Giải đáp, nhắc lại đúng điều ứng viên vừa chia sẻ.",
d:"Lịch hoạt động tuần mẫu của người mới (bản hiện hành)."
},
{id:2,g:1,q:"Tôi chưa sẵn sàng / để tôi suy nghĩ thêm.",s:[
["Tôn trọng nhu cầu cần thêm thời gian; không thúc ép quyết định ngay.","Mình tôn trọng việc bạn muốn suy nghĩ thêm. Hôm nay bạn chưa cần quyết định gì đâu."],
["Hỏi điều gì khiến ứng viên chưa sẵn sàng nhất: gia đình, hình ảnh nghề, rủi ro thu nhập hay sự tự tin.","Vậy điều gì khiến bạn thấy mình chưa sẵn sàng nhất lúc này?"],
["Gắn đúng nguyên nhân vừa khám phá; tách “quyết định tìm hiểu” khỏi “quyết định tham gia”.","Ở bước này bạn chưa cần quyết định có tham gia hay không. Nếu điều bạn còn thiếu là [thông tin vừa nêu], mình gửi đúng tài liệu đó để bạn xem trước nhé."],
["Chốt một bước nhỏ gắn với nguyên nhân; kết thúc bằng câu hỏi mở.","Bạn xem trước tài liệu về [điều còn thiếu], rồi [thứ Năm] mình nói chuyện thêm 15 phút nhé? Bạn còn băn khoăn điều gì nữa không?"]],
n:"Lý do thật thường nằm sau câu “để suy nghĩ”: gia đình, hình ảnh nghề, thu nhập hoặc sự tự tin. Hỏi ra rồi mới giải đáp.",
d:"Đúng tài liệu cho nguyên nhân ứng viên nêu (thu nhập, đào tạo, quyền lợi…)."
},
{id:3,g:1,m:"Bác sĩ",q:"Học 4-5 ngày lâu quá.",s:[
["Công nhận 4-5 ngày là một khoản đầu tư thời gian đáng cân nhắc.","Mình hiểu, dành ra 4-5 ngày đi học thì cũng cần cân nhắc và sắp xếp."],
["Làm rõ ứng viên lo về lịch học, công việc hiện tại hay chưa thấy giá trị của đào tạo.","Bạn băn khoăn nhất về lịch học, công việc hiện tại, hay chưa thấy rõ 5 ngày học sẽ được gì?"],
["Đưa dữ kiện trước: lịch từng ngày, nội dung bắt buộc, phần thực hành, yêu cầu hoàn tất.","Đúng là bốn, năm ngày cũng là một khoản đầu tư đáng cân nhắc. Đây là lịch học từng ngày: phần bắt buộc, phần thực hành và yêu cầu để hoàn tất. Bạn xem trước phần liên quan đến điều bạn đang băn khoăn nhé."],
["Tóm tắt nội dung 5 ngày học vừa xem; chốt bằng câu hỏi mở.","(Sau khi cùng xem lịch học) Chúng ta vừa cùng xem nội dung từng ngày trong 5 ngày học. Bạn thấy mình có sắp xếp được không, và còn cần thêm thông tin gì không?"]],
n:"Dùng hình ảnh Bác sĩ ở bước Giải đáp. Không phóng đại lộ trình hoặc điều kiện cấp chứng nhận.",
d:"Lịch và nội dung đào tạo chính thức (bảng một trang theo ngày). Ẩn dụ bác sĩ chỉ dùng sau dữ kiện, không thay bằng chứng."
},
{id:4,g:1,q:"Tôi chỉ làm bán thời gian được thôi.",s:[
["Ghi nhận ứng viên đang cân nhắc thực tế quỹ thời gian của mình.","Bạn tính trước quỹ thời gian của mình như vậy là rất thực tế, mình đánh giá cao điều đó."],
["Hỏi quỹ thời gian cụ thể mỗi tuần và kỳ vọng của ứng viên khi tham gia.","Mỗi tuần bạn có thể dành khoảng bao nhiêu thời gian? Và bạn mong công việc này mang lại cho mình điều gì?"],
["Không hứa kết quả; đối chiếu lịch thực tế với yêu cầu hoạt động hiện hành.","Bán thời gian có thể hợp hoặc chưa, còn tùy quỹ giờ của bạn và yêu cầu hoạt động hiện hành. Mình cùng đặt lịch thực tế của bạn cạnh những việc cần làm nhé: nếu chưa đủ, chúng ta có thể cùng xem xét lại."],
["Tóm tắt kết quả vừa so lịch với yêu cầu tối thiểu; chưa cần cam kết; chốt bằng câu hỏi mở.","(Sau khi cùng so lịch) Chúng ta vừa cùng so quỹ giờ của bạn với yêu cầu hoạt động tối thiểu. Bạn chưa cần cam kết gì đâu. Bạn có cần thêm thông tin gì để cân nhắc không?"]],
n:"Không hứa “làm ít vẫn thu nhập cao”. Chỉ giải thích theo quy định hiện hành về thời gian và yêu cầu hoạt động.",
d:"Yêu cầu hoạt động tối thiểu, khung giờ đào tạo, điều kiện duy trì."
},
{id:5,g:1,q:"Làm cả tối, cuối tuần thì còn đâu thời gian cho gia đình.",s:[
["Ghi nhận ưu tiên dành thời gian cho gia đình.","Thời gian cho gia đình rất quan trọng, mình hoàn toàn hiểu và trân trọng điều đó."],
["Hỏi khung giờ ứng viên muốn giữ cho gia đình và khung giờ có thể làm việc.","Có khung giờ nào bạn muốn giữ trọn cho gia đình không? Còn trong tuần, bạn có thể dành những lúc nào cho công việc?"],
["Nói thật có lúc gặp khách ngoài giờ; xác lập trước khung giờ gia đình không thương lượng.","Lịch hẹn là do bạn chủ động, dù cũng có khách chỉ rảnh buổi tối. Nên bạn cứ chọn trước hai khung giờ dành riêng cho gia đình, rồi chúng ta cùng xem thời gian còn lại sắp xếp thế nào nhé."],
["Cùng ứng viên đánh dấu lịch thật (không dùng lịch mẫu lý tưởng); tóm tắt kết quả, chốt bằng câu hỏi mở.","(Sau khi cùng đánh dấu lịch) Chúng ta vừa giữ trọn hai khung giờ cho gia đình và sắp xếp phần thời gian còn lại cho công việc. Bạn còn băn khoăn điều gì nữa không?"]],
n:"Khác thẻ 01 (bận ở hiện tại): đây là lo ngại cân bằng lâu dài. Nói thật về việc đôi khi gặp khách ngoài giờ; không hứa “hoàn toàn tự do thời gian”.",
d:"Lịch thật của ứng viên + yêu cầu hoạt động tuần."
},
{id:6,g:1,q:"Gia đình tôi không đồng ý.",s:[
["Trân trọng việc ứng viên coi trọng ý kiến gia đình.","Bạn hỏi ý kiến gia đình trước khi quyết định, mình thấy điều đó rất đáng quý."],
["Hỏi gia đình lo điều gì cụ thể: thu nhập, thời gian, hình ảnh nghề hay sự ổn định.","Theo bạn, gia đình đang lo nhất điều gì: thu nhập, thời gian dành cho nhà, hình ảnh của nghề hay sự ổn định?"],
["Không mặc định gia đình thiếu thông tin; phân biệt thiếu thông tin với đánh giá rủi ro.","Mình hỏi thêm chút nhé: gia đình chưa có đủ thông tin, hay đã hiểu rồi nhưng thấy rủi ro chưa phù hợp? Vì mỗi trường hợp, mình sẽ cần trao đổi theo một cách khác."],
["Gửi tài liệu để ứng viên tự trao đổi trước; chỉ mời người thân khi ứng viên chủ động đồng ý.","Mình gửi bạn tài liệu về đúng điều [gia đình đang lo] để bạn nói chuyện với gia đình trước. Nếu bạn thấy cần, mình sẽ mời [người thân] cùng nghe sau, được không?"]],
n:"Không đặt ứng viên vào thế đối đầu với gia đình. Mục tiêu là để người thân có đủ thông tin, không phải thuyết phục bằng mọi giá.",
d:"Tài liệu chính thức đúng mối lo của gia đình."
},
{id:7,g:1,q:"Tôi chỉ tính làm tạm trong lúc tìm việc khác.",s:[
["Ghi nhận sự thẳng thắn; cân nhắc nhiều hướng khi chuyển việc là bình thường.","Cảm ơn bạn đã nói thẳng. Trong lúc chuyển việc, cân nhắc nhiều hướng là chuyện bình thường."],
["Hỏi tiêu chí của công việc tiếp theo mà ứng viên đang tìm.","Công việc tiếp theo bạn đang tìm cần đáp ứng những gì: thu nhập, môi trường hay cơ hội phát triển?"],
["Khuyến khích thử nghiêm túc ít nhất 90 ngày đầu; có kết quả rồi ứng viên có thể nhìn khác.","Dù sao bạn cũng sẽ bỏ thời gian và công sức vào đây, vậy mình thử làm nghiêm túc ít nhất 90 ngày đầu nhé. Khi đã có kết quả thật, biết đâu bạn lại nhìn công việc này khác đi."],
["Gửi yêu cầu thực tế 6–12 tháng đầu; kết thúc bằng câu hỏi mở.","Mình gửi bạn kế hoạch 90 ngày đầu để bạn tham khảo nhé. Bạn có cần thêm thông tin gì để cân nhắc không?"]],
n:"Không tuyển với tâm thế “làm tạm, bán vài hợp đồng rồi nghỉ” – tuyển dụng chất lượng cần cam kết hai phía.",
d:"Yêu cầu thực tế 6–12 tháng đầu."
},
{id:8,g:2,q:"Tôi thấy nhiều thông tin không tốt trên mạng.",s:[
["Ghi nhận mối lo; không phủ nhận hay tranh luận với thông tin ứng viên đã thấy.","Mình hiểu vì sao những thông tin đó làm bạn băn khoăn, và mình không phủ nhận điều bạn đã đọc. Bạn cân nhắc kỹ như vậy là đúng."],
["Hỏi cụ thể thông tin nào khiến ứng viên lo nhất: sản phẩm, công ty, tư vấn viên hay ngành.","Cụ thể thông tin nào làm bạn lo nhất: về sản phẩm, về công ty, về tư vấn viên hay về ngành bảo hiểm nói chung?"],
["Tách 3 phần: điều kiểm chứng được – trải nghiệm cá nhân – phần chưa đủ dữ kiện; không tranh luận.","Bạn gửi mình nội dung cụ thể nhé. Mình sẽ cùng bạn tách ra: đâu là điều kiểm chứng được, đâu là trải nghiệm cá nhân, đâu là chưa đủ thông tin. Chỗ nào chưa rõ, chúng ta có thể cùng tìm hiểu thêm."],
["Cùng kiểm chứng ngay một thông tin cụ thể; ghi lại câu hỏi còn lại.","Mình chọn ra một thông tin bạn lo nhất và cùng kiểm chứng ngay bây giờ nhé? Những điểm còn lại mình ghi lại và trả lời bạn sau."]],
n:"Ứng viên cần bằng chứng, không cần thêm lời hứa. Chỉ dùng ca chi trả, số liệu từ nguồn chính thức được phép chia sẻ.",
d:"Nguồn chính thức liên quan đến nội dung ứng viên đưa ra."
},
{id:9,g:2,m:"Khối Rubik",q:"Nghề này không bền vững, thấy nhiều người vào rồi ra.",s:[
["Không phủ nhận thực tế có người vào rồi ra; ghi nhận đây là câu hỏi cần làm rõ.","Bạn hỏi vậy là rất hợp lý. Thực tế cũng có người vào nghề rồi rời đi, nên tìm hiểu kỹ là đúng."],
["Hỏi “bền vững” với ứng viên là gì: thu nhập, năng lực, khách hàng, môi trường hay thăng tiến.","Với bạn, một nghề “bền vững” cần có những gì: thu nhập, năng lực, khách hàng, môi trường hay cơ hội thăng tiến?"],
["Không dùng tỷ lệ chưa xác minh; đưa 3 thứ kiểm tra được: yêu cầu công việc, lộ trình hỗ trợ, điều kiện duy trì.","Mình cho bạn xem ba điều kiểm chứng được: yêu cầu công việc, lộ trình hỗ trợ và điều kiện duy trì, để chúng ta cùng so với ý ‘bền vững’ của bạn nhé."],
["Tóm tắt kết quả đối chiếu 3 dữ kiện với tiêu chí “bền vững” của ứng viên; chốt bằng câu hỏi mở.","(Sau khi cùng đối chiếu) Chúng ta vừa cùng so ba điều này với tiêu chí ‘bền vững’ của bạn. Bạn thấy thế nào, còn điều gì bạn muốn tìm hiểu thêm không?"]],
n:"Có thể dùng hình ảnh Rubik ở bước Giải đáp. Không dùng các tỷ lệ “ra đi” hay “thành công” chưa được xác minh.",
d:"Yêu cầu công việc, lộ trình hỗ trợ, điều kiện duy trì (bản hiện hành). Không dùng Rubik làm bằng chứng."
},
{id:10,g:2,q:"Tôi ngại bán cho người thân, bạn bè.",s:[
["Đồng cảm: không ai muốn làm phiền hay ảnh hưởng mối quan hệ thân thiết.","Mình hiểu, không ai muốn người thân, bạn bè phải khó xử vì mình cả."],
["Hỏi điều ứng viên ngại nhất: bị từ chối, bị hiểu lầm hay sợ mất lòng.","Điều bạn ngại nhất là bị từ chối, bị hiểu lầm, hay sợ mất lòng nhau?"],
["Tư vấn theo nhu cầu, không ép; người thân không phải “nguồn phải khai thác” và có quyền từ chối.","Tư vấn đúng cách là giúp người ta hiểu giải pháp nào hợp với nhu cầu của họ, chứ không phải ép mua. Người thân luôn có quyền chọn, và bạn sẽ được hướng dẫn cách tiếp cận họ một cách khéo léo và tôn trọng."],
["Cho xem cách xin phép trao đổi, tôn trọng lựa chọn của khách hàng và giữ gìn mối quan hệ.","Bạn có muốn xem thử một buổi tư vấn mẫu không? Bạn sẽ thấy cách xin phép trước khi chia sẻ, tôn trọng lựa chọn của người nghe mà vẫn giữ được tình cảm."]],
n:"Không yêu cầu ứng viên lập danh sách người thân để “khai thác” ngay. Nhấn mạnh tư vấn dựa trên nhu cầu và sự tôn trọng.",
d:"Quy trình tư vấn chuẩn, có bước xin phép và tôn trọng quyền từ chối."
},
{id:11,g:2,q:"Vào làm rồi có bị ép mua bảo hiểm không?",s:[
["Ghi nhận lo ngại; nhiều người từng nghe chuyện này.","Mình hiểu, nhiều người cũng hỏi câu này trước khi tham gia. Bạn hỏi thẳng như vậy là rất tốt."],
["Hỏi ứng viên nghe chuyện này từ đâu, có người quen từng gặp không.","Bạn nghe chuyện này từ đâu, hay có người quen từng gặp tình huống như vậy?"],
["Trả lời trực tiếp bằng chính sách hiện hành đã phê duyệt; chưa có tài liệu thì nói cần xác minh.","Theo chính sách hiện hành thì [trích đúng chính sách đã phê duyệt]. Đây là tài liệu để bạn tự kiểm tra. Còn có mua bảo hiểm cho bản thân hay không là quyết định của riêng bạn."],
["Gửi tài liệu chính sách; điểm chưa rõ thì xác minh và hẹn thời điểm trả lời.","Bạn xem trước tài liệu này nhé. Chỗ nào chưa rõ, mình sẽ hỏi lại đầu mối chính thức và trả lời bạn trước [ngày cụ thể], được không?"]],
n:"Nhấn mạnh nguyên tắc tự nguyện và tư vấn đúng nhu cầu; không dùng doanh số cá nhân làm ví dụ.",
d:"Chính sách chính thức liên quan (bản đã phê duyệt). Nếu chưa có tài liệu, nói “Mình cần xác minh”, không khẳng định bằng lời."
},
{id:12,g:2,q:"Lỡ khách hàng không được chi trả, tôi mang tiếng.",s:[
["Ghi nhận tinh thần trách nhiệm với khách hàng.","Bạn nghĩ đến quyền lợi của khách hàng ngay từ đầu, mình rất quý điều đó."],
["Hỏi ứng viên lo trường hợp nào: tư vấn sai, khách kê khai thiếu hay thủ tục chi trả.","Bạn lo nhất điều gì: mình tư vấn chưa đúng, khách kê khai chưa đủ, hay thủ tục chi trả phức tạp?"],
["Tư vấn đúng không bảo đảm mọi yêu cầu được chi trả; nêu rõ vai trò của tư vấn viên.","Tư vấn đúng là nền tảng, còn việc chi trả sẽ căn cứ vào điều khoản và hồ sơ. Vai trò của bạn là giải thích đúng phạm vi bảo vệ, hướng dẫn khách kê khai trung thực và đồng hành cùng khách qua kênh hỗ trợ chính thức."],
["Cho xem quy trình xử lý yêu cầu quyền lợi; không dùng ca thành công đơn lẻ để thuyết phục.","Mình cùng xem quy trình giải quyết quyền lợi, kể cả trường hợp hồ sơ bị từ chối, để bạn thấy rõ vai trò của mình ở đâu nhé?"]],
n:"Không hứa “chắc chắn được chi trả”; chỉ dùng ca chi trả, số liệu từ nguồn chính thức.",
d:"Quy trình xử lý yêu cầu quyền lợi chính thức."
},
{id:13,g:2,q:"Tôi từng có trải nghiệm không tốt với bảo hiểm.",s:[
["Lắng nghe, chia sẻ cảm xúc; không bào chữa hay đổ lỗi.","Mình rất tiếc về trải nghiệm đó. Bạn thấy không vui cũng là điều hoàn toàn dễ hiểu."],
["Hỏi cụ thể chuyện gì đã xảy ra và điều gì khiến ứng viên thất vọng nhất.","Bạn có thể chia sẻ chuyện gì đã xảy ra không? Điều gì khiến bạn thất vọng nhất?"],
["Tóm tắt điều ứng viên thất vọng; hỏi họ muốn được làm rõ hay chỉ cần được lắng nghe.","Mình hiểu, điều làm bạn thất vọng nhất là [tóm tắt]. Bạn có muốn mình chia sẻ thêm về những điểm này không?"],
["Hỗ trợ qua kênh chính thức nếu cần; chỉ nói về nghề khi ứng viên đã sẵn sàng.","Nếu bạn muốn, mình hỗ trợ bạn làm rõ chuyện đó qua kênh chính thức. Khi nào bạn thấy thoải mái, mình mới nói chuyện về cơ hội nghề nghiệp, được không?"]],
n:"Nghe trọn câu chuyện trước khi nói. Không hứa kết quả giải quyết hồ sơ; chỉ hướng dẫn kênh chính thức.",
d:"Kênh hỗ trợ khách hàng chính thức. Không biến trải nghiệm xấu thành “thế mạnh” trước khi ứng viên sẵn sàng."
},
{id:14,g:2,q:"Tôi từng làm bảo hiểm rồi, không hợp.",s:[
["Ghi nhận trải nghiệm thực tế; trân trọng việc ứng viên đã từng thử sức.","Cảm ơn bạn đã chia sẻ. Bạn đã dám thử sức, và trải nghiệm đó rất đáng quý."],
["Hỏi điều gì chưa phù hợp: đào tạo, người dẫn dắt, thời điểm hay môi trường.","Hồi đó điều gì làm bạn thấy chưa hợp: chuyện đào tạo, người dẫn dắt, thời điểm hay môi trường làm việc?"],
["Tách nguyên nhân cũ khỏi bối cảnh hiện tại; làm rõ khác biệt tại Prudential so với trải nghiệm cũ của ứng viên.","Lần trước là ở một môi trường khác. Ở Prudential, những chuyện như [điều chưa hợp] có lộ trình đào tạo bài bản và Quản lý đồng hành trực tiếp. Mình cho bạn xem điểm khác biệt cụ thể nhé."],
["Tóm tắt điểm khác biệt vừa cùng xem; kết thúc bằng câu hỏi mở.","(Sau khi cùng xem điểm khác biệt) Chúng ta vừa cùng xem những điểm khác biệt ở Prudential so với trải nghiệm trước đây của bạn. Bạn còn cần thêm thông tin gì không?"]],
n:"Không chê nơi làm cũ của ứng viên. Người từng làm nghề là ứng viên có kinh nghiệm – hãy hỏi kỹ để hiểu lý do thật.",
d:"Chương trình đào tạo và hỗ trợ hiện hành."
},
{id:15,g:2,m:"Bác sĩ",q:"Người ta sẽ nghĩ tôi hết việc mới đi bán bảo hiểm.",s:[
["Ghi nhận lo ngại về hình ảnh cá nhân khi chọn nghề mới.","Mình hiểu, ai cũng quan tâm người khác nhìn mình thế nào, nhất là khi chọn một nghề mới."],
["Hỏi ý kiến của ai quan trọng nhất và chính ứng viên nhìn nghề thế nào.","Ý kiến của ai là quan trọng nhất với bạn? Còn bản thân bạn, bạn nhìn nghề tư vấn tài chính thế nào?"],
["Ứng viên không kiểm soát mọi cách nhìn; kiểm soát được chuẩn mực làm việc và sự phù hợp giá trị.","Mình không quyết định được người khác nghĩ gì về nghề này. Nhưng mình quyết định được cách mình làm: có chuẩn mực, minh bạch, và nghề này có hợp với giá trị của mình hay không."],
["Mời gặp người đã chuyển nghề; khuyến khích hỏi cả điều khó và điều bất ngờ.","Mình giới thiệu bạn gặp một anh/chị từng chuyển từ văn phòng sang nhé? Bạn cứ hỏi thoải mái, cả chuyện khó, chuyện bất ngờ lẫn lý do họ ở lại với nghề."]],
n:"Không hạ thấp nghề khác để nâng nghề mình. Có thể dùng hình ảnh Bác sĩ: uy tín đến từ sự chuẩn bị bài bản.",
d:"Chuẩn mực nghề nghiệp, quy tắc đạo đức tư vấn."
},
{id:16,g:3,q:"Tôi không có nhiều mối quan hệ.",s:[
["Công nhận lo về nguồn khách hàng là băn khoăn phổ biến khi cân nhắc nghề.","Mình hiểu, chưa có nhiều mối quan hệ thì lo lắng cũng là dễ hiểu."],
["Khám phá mạng lưới hiện có trong công việc, học tập, gia đình và cộng đồng.","Hiện bạn hay kết nối với những nhóm nào: đồng nghiệp, bạn học, họ hàng hay cộng đồng xung quanh?"],
["Mạng lưới ban đầu có ảnh hưởng nhưng không phải yếu tố duy nhất; có phương pháp phát triển thị trường được đào tạo.","Mối quan hệ ban đầu có giúp ích, nhưng không phải là tất cả. Mình cho bạn xem những cách phát triển khách hàng mà bạn sẽ được đào tạo, rồi bạn tự đánh giá xem có hợp không nhé."],
["Nói rõ không liên hệ ai khi chưa đồng ý và chưa được đào tạo; sau đó mới phác bản đồ quan hệ.","Mình chỉ cùng bạn vẽ thử bản đồ mối quan hệ để biết nên bắt đầu từ đâu, chưa liên hệ ai khi bạn chưa đồng ý và chưa được đào tạo. Bạn thấy vậy được không?"]],
n:"Không biến người quen của ứng viên thành danh sách phải “khai thác” ngay. Bản đồ mạng lưới chỉ để thấy điểm bắt đầu.",
d:"Các phương pháp phát triển thị trường trong chương trình đào tạo."
},
{id:17,g:3,m:"Khối Rubik",q:"Công việc này khó, tôi sợ mình không thành công.",s:[
["Ghi nhận thiếu tự tin là bình thường khi bước vào một lĩnh vực mới.","Chưa làm bao giờ mà thấy công việc này khó thì cũng dễ hiểu thôi."],
["Hỏi ứng viên lo nhất phần nào: tìm khách hàng, tư vấn, kiến thức, thu nhập hay kỷ luật bản thân.","Bạn đang lo nhất phần nào: tìm khách hàng, tư vấn, kiến thức, thu nhập hay giữ kỷ luật cho bản thân?"],
["Quy trình, người hướng dẫn giúp bớt tự mò nhưng không bảo đảm kết quả; nêu hỗ trợ cụ thể.","Có quy trình và người hướng dẫn thì bạn không phải tự mò; phần còn lại là thời gian, kỷ luật và thực hành của chính bạn. Mình cho bạn xem phần bạn lo nhất sẽ được hỗ trợ thế nào nhé."],
["Tóm tắt hỗ trợ cho đúng phần ứng viên lo nhất, rồi mời chọn một bước trải nghiệm nhỏ.","(Sau khi cùng xem phần hỗ trợ) Chúng ta vừa xem ai sẽ hỗ trợ và hỗ trợ gì cho [phần ứng viên lo nhất]. Bạn có muốn chọn một bước nhỏ để trải nghiệm thử không?"]],
n:"Thực hành: lắng nghe trước, trả lời sau. Dùng hình ảnh Rubik; không hứa “chắc chắn thành công”.",
d:"Lộ trình hỗ trợ người mới (hành vi hỗ trợ cụ thể). Rubik chỉ là hình ảnh minh họa sau dữ kiện; không nói “ai cũng học được”."
},
{id:18,g:3,q:"Tôi không thích công việc bán hàng.",s:[
["Tôn trọng cảm nhận; nhiều người có ấn tượng chưa tốt với kiểu bán hàng ép buộc.","Mình hiểu. Nhiều người không thích bán hàng vì từng gặp kiểu chào mời ép buộc."],
["Hỏi điều ứng viên không thích: chào mời, bị từ chối hay cách bán hàng từng gặp.","Cụ thể bạn không thích điều gì: phải chào mời, bị từ chối, hay kiểu bán hàng bạn từng gặp?"],
["Mô tả đầy đủ cả tư vấn lẫn hoạt động kinh doanh; không né bản chất bán hàng.","Thật ra công việc này vừa là tư vấn vừa là kinh doanh: tìm khách hàng, hẹn gặp, trình bày giải pháp, xử lý từ chối và theo dõi kết quả. Trong mấy việc này, việc nào bạn thấy ngại nhất?"],
["Mời xem buổi tư vấn mẫu và kế hoạch hoạt động thực tế (job preview), kể cả phần khó.","Bạn xem thử một buổi tư vấn mẫu và kế hoạch hoạt động thực tế, kể cả những phần khó, rồi tự đánh giá xem có hợp không nhé?"]],
n:"Đổi góc nhìn từ “bán hàng” sang “tư vấn – giúp đỡ”. Không phủ nhận rằng công việc có yếu tố kinh doanh.",
d:"Kế hoạch hoạt động thực tế của người mới, buổi tư vấn mẫu."
},
{id:19,g:3,m:"Khối Rubik",q:"Tôi không giỏi ăn nói.",s:[
["Ghi nhận sự khiêm tốn; nhiều người cũng lo như vậy khi bắt đầu.","Mình hiểu, rất nhiều người cũng lo như bạn khi mới bắt đầu."],
["Hỏi ứng viên thấy khó ở tình huống nào: mở lời, câu hỏi khó hay nói trước đông người.","Bạn thấy khó nhất lúc nào: lúc mở lời, lúc gặp câu hỏi khó hay khi nói trước đông người?"],
["Tư vấn tốt cần lắng nghe và hỏi đúng hơn là nói hay; kỹ năng này luyện được.","Tư vấn tốt không cần nói hay, mà cần biết lắng nghe và hỏi đúng. Kỹ năng này bạn sẽ được hướng dẫn và luyện tập từng bước."],
["Cho thử hội thoại 3 phút: hỏi 2 câu, tóm tắt nhu cầu; phản hồi hành vi cụ thể.","Mình thử ngay 3 phút nhé: bạn chỉ cần hỏi mình hai câu rồi tóm tắt lại nhu cầu của mình. Xong mình góp ý cụ thể cho bạn."]],
n:"Có thể dùng hình ảnh Rubik ở bước Giải đáp.",
d:"Quy trình tư vấn mẫu. Không khẳng định “người ít nói thường lắng nghe tốt”."
},
{id:20,g:3,m:"Bác sĩ",q:"Tôi không có kiến thức về tài chính, bảo hiểm.",s:[
["Công nhận đây là băn khoăn hợp lý khi chuyển sang lĩnh vực mới.","Bạn lo về kiến thức là hợp lý, vì công việc này liên quan trực tiếp đến quyền lợi của khách hàng."],
["Hỏi nền tảng hiện tại và cách ứng viên từng học một điều mới.","Hiện bạn đang làm lĩnh vực gì? Bạn đã từng học một kỹ năng mới từ con số không chưa, lúc đó bạn học thế nào?"],
["Nêu cụ thể: học chủ đề nào, kiểm tra/chứng nhận gì, khi nào được tư vấn, ai kiểm tra.","Chương trình đào tạo được thiết kế cụ thể: học những gì, thi hay lấy chứng chỉ gì, khi nào được bắt đầu tư vấn, và ai đồng hành để bảo đảm bạn tư vấn đúng."],
["Tóm tắt chương trình vừa xem, chỉ ra kinh nghiệm hiện có dùng được ở đâu; chốt bằng câu hỏi mở.","(Sau khi cùng xem chương trình) Chúng ta vừa cùng xem chương trình học và tiêu chuẩn hoàn tất; kinh nghiệm [lĩnh vực của ứng viên] của bạn sẽ rất hữu ích ở [điểm cụ thể]. Bạn còn cần thêm thông tin gì không?"]],
n:"Dùng hình ảnh Bác sĩ ở bước Giải đáp. Không nói “không cần kiến thức vẫn làm được”.",
d:"Chương trình đào tạo người mới, yêu cầu kiểm tra/chứng nhận (bản hiện hành)."
},
{id:21,g:3,q:"Tôi sợ bị từ chối, bị người ta tỏ thái độ.",s:[
["Ghi nhận cảm xúc rất thật; ai cũng ngại bị từ chối.","Ai cũng ngại bị từ chối, kể cả người làm lâu năm. Bạn nói thật được như vậy là rất đáng quý."],
["Hỏi trải nghiệm bị từ chối khiến ứng viên ngại nhất.","Có lần bị từ chối nào làm bạn nhớ nhất không? Lúc đó điều gì làm bạn khó chịu nhất?"],
["Khẳng định lộ trình đào tạo bài bản về kỹ năng xử lý từ chối và sự đồng hành của Quản lý.","Prudential có lộ trình đào tạo bài bản để tư vấn viên mới có đủ kiến thức và kỹ năng, nhất là kỹ năng xử lý từ chối. Mình cũng sẽ đi cùng bạn trong những lần gặp khách hàng đầu tiên."],
["Mời trải nghiệm buổi luyện xử lý từ chối; kết thúc bằng câu hỏi mở.","Bạn thử tham gia một buổi luyện xử lý từ chối cùng mình nhé? Bạn còn băn khoăn điều gì nữa không?"]],
n:"Không nói “rồi sẽ quen, chai mặt”; tập trung vào kỹ năng và cách nhìn. Có thể lấy chính quy trình 4 bước làm ví dụ.",
d:"Nội dung luyện kỹ năng xin phép và xử lý từ chối."
},
{id:22,g:3,m:"Khối Rubik",q:"Tôi sợ vào rồi không có ai hỗ trợ.",s:[
["Ghi nhận nhu cầu được đồng hành khi bắt đầu việc mới.","Bắt đầu một công việc mới, ai cũng mong có người đồng hành. Mình hiểu băn khoăn của bạn."],
["Hỏi ứng viên cần hỗ trợ nhất ở đâu và đã từng thiếu sự hỗ trợ chưa.","Bạn mong được hỗ trợ nhất ở mảng nào: kiến thức, kỹ năng hay đi gặp khách hàng? Trước đây bạn đã từng bị thiếu hỗ trợ như vậy chưa?"],
["Chỉ nêu hỗ trợ kiểm chứng được: ai, việc gì, tần suất, kênh, giới hạn.","Trong 3 tháng đầu, đây là những việc mình trực tiếp hỗ trợ bạn, bao lâu một lần, và lúc nào bạn có thể chủ động nhờ mình. Chúng ta thống nhất rõ từ đầu để bạn yên tâm nhé."],
["Tóm tắt bản cam kết hỗ trợ 3 tháng đầu vừa cùng xem; chốt bằng câu hỏi mở.","(Sau khi cùng xem bảng cam kết) Chúng ta vừa cùng xem rõ ai hỗ trợ, hỗ trợ việc gì và qua kênh nào trong 3 tháng đầu. Bạn còn băn khoăn điều gì nữa không?"]],
n:"Chỉ cam kết những hỗ trợ bạn thực sự làm được. Có thể dùng hình ảnh Khối Rubik.",
d:"Bản cam kết hỗ trợ một trang (support charter). Chỉ cam kết điều Quản lý thực sự làm được."
},
{id:23,g:4,q:"Chính sách / cơ chế ở đây không tốt bằng nơi khác.",s:[
["Thừa nhận chính sách là tiêu chí hợp lý khi so sánh các cơ hội.","Bạn nói đúng, chính sách và cơ chế là điều rất quan trọng khi cân nhắc một cơ hội."],
["Làm rõ ứng viên ưu tiên gì: thu nhập, đào tạo, thương hiệu, văn hóa, hỗ trợ hay lộ trình.","Ngoài cơ chế ra, bạn còn ưu tiên điều gì: thu nhập, đào tạo, người dẫn dắt, thương hiệu, văn hóa hay lộ trình phát triển?"],
["Chỉ dùng thông tin hiện hành đã xác minh, có nguồn; so sánh theo tiêu chí ứng viên nêu.","Mình sẽ chia sẻ thông tin hiện hành đã được xác minh, có ghi rõ nguồn và thời gian áp dụng, để bạn so sánh đúng theo những tiêu chí bạn vừa nói."],
["Tóm tắt bảng so sánh vừa lập (cùng kỳ, cùng điều kiện, có nguồn); chốt bằng câu hỏi mở.","(Sau khi cùng lập bảng so sánh) Chúng ta vừa đặt các lựa chọn lên chung một bảng, cùng thời điểm và cùng điều kiện. Bạn còn cần thêm thông tin gì để cân nhắc không?"]],
n:"Không chê nơi khác, không khẳng định “nơi khác không theo kịp” khi chưa có dữ liệu so sánh được duyệt.",
d:"Chính sách hiện hành có nguồn và kỳ áp dụng. Không tự chọn tiêu chí chỉ có lợi cho mình."
},
{id:24,g:4,q:"Công việc / thu nhập hiện tại của tôi đang rất tốt.",s:[
["Ghi nhận thành quả hiện tại; không khiến ứng viên phải phủ nhận những gì đang có.","Bạn đang có công việc và thu nhập tốt, đó là điều rất đáng mừng. Mình không có ý thuyết phục bạn bỏ những gì đang có."],
["Tìm hiểu điều ứng viên muốn có thêm trong 3–5 năm: thu nhập, tự chủ, phát triển, ảnh hưởng, thời gian, lãnh đạo.","Trong 3–5 năm tới, bạn còn muốn có thêm điều gì không: thu nhập, sự tự chủ, cơ hội phát triển, thời gian hay vai trò lãnh đạo?"],
["Không thay đổi cũng là lựa chọn hợp lý; chỉ tiếp tục nếu có khoảng trống cụ thể.","Nếu công việc hiện tại đã đáp ứng tốt những gì bạn ưu tiên, thì giữ nguyên cũng là lựa chọn hợp lý. Mình chỉ nói tiếp nếu có điều gì đó bạn còn muốn mà chưa có."],
["Hẹn trao đổi ngắn về khoảng trống ứng viên nêu; kết thúc bằng câu hỏi mở.","Mình nói chuyện thêm một chút về [điều vừa nêu] để xem cơ hội này có thể bổ sung gì cho bạn nhé? Bạn còn băn khoăn điều gì không?"]],
n:"Không chê công việc hay công ty hiện tại của ứng viên; không hứa “thu nhập gấp mấy lần”.",
d:"Không bắt buộc – chỉ mở tài liệu liên quan khoảng trống ứng viên nêu."
},
{id:25,g:4,q:"Làm tư vấn thì không có BHXH, phúc lợi như đi làm công ty.",s:[
["Ghi nhận sự quan tâm đến an sinh lâu dài.","Bạn nghĩ đến BHXH và phúc lợi lâu dài ngay từ đầu, như vậy là rất chín chắn."],
["Hỏi phúc lợi nào ứng viên quan tâm nhất: hưu trí, sức khỏe, ngày nghỉ.","Trong các phúc lợi đó, bạn quan tâm nhất điều gì: lương hưu, chăm sóc sức khỏe hay ngày nghỉ?"],
["Liệt kê đủ quyền lợi có và không có; phần không có ứng viên tự bố trí, tự chịu chi phí.","Với tư cách làm việc hiện hành, đây là những quyền lợi bạn có và những phần bạn sẽ tự sắp xếp. Mình liệt kê đủ cả hai bên để chúng ta cùng so sánh cho rõ nhé."],
["Tóm tắt bảng Có / Không có / Tự lo / Cần xác minh, gửi bảng để ứng viên xem lại; chốt bằng câu hỏi mở.","(Sau khi cùng so sánh) Chúng ta vừa cùng so phần có, phần tự lo và phần cần xác minh. Mình gửi bạn bảng này theo chính sách mới nhất để bạn xem lại. Bạn còn cần thêm thông tin gì không?"]],
n:"Chỉ dùng thông tin chính sách chính thức, cập nhật; không nói quá về quyền lợi.",
d:"Chính sách quyền lợi tư vấn viên (bản cập nhật). Không biến bất lợi thành lợi thế quá nhanh."
},
{id:26,g:4,q:"Vào làm có phải đóng phí hay bỏ tiền ra không?",s:[
["Ghi nhận sự cẩn trọng về tiền bạc; đây là câu hỏi chính đáng.","Bạn hỏi rõ chuyện chi phí ngay từ đầu là rất cẩn thận. Mình trả lời thẳng luôn nhé."],
["Hỏi ứng viên đã nghe hoặc đang lo về khoản chi phí nào.","Bạn đã nghe nói đến khoản phí nào chưa, hay bạn lo phải bỏ vốn như khi kinh doanh?"],
["Trả lời trực tiếp bằng bảng chi phí chính thức; chưa có dữ liệu thì không đoán.","Đây là bảng các khoản theo tài liệu chính thức: tên khoản, bắt buộc hay không, bao nhiêu tiền, nộp cho ai và có được hoàn lại không."],
["Khoản chưa rõ: cùng hỏi đầu mối chính thức để xác minh trước khi ứng viên quyết định.","Khoản nào chưa rõ, mình sẽ hỏi đầu mối chính thức và trả lời bạn trước [ngày cụ thể], trước khi bạn quyết định, được không?"]],
n:"Chỉ nói theo thông tin chính thức; không khẳng định “không mất gì” khi chưa chắc chắn.",
d:"Bảng phí và quy trình gia nhập: tên khoản, bắt buộc/tùy chọn, số tiền, nộp cho ai, hoàn lại, thời điểm, nguồn."
},
{id:27,g:4,q:"Không có lương cứng, tôi không yên tâm.",s:[
["Ghi nhận nhu cầu thu nhập ổn định là chính đáng.","Mong muốn thu nhập ổn định là hoàn toàn chính đáng, nhất là khi bạn có nhiều trách nhiệm."],
["Xin phép trước; ứng viên có thể dùng một mức chi tối thiểu tự chọn, không cần kể từng khoản.","Giai đoạn đầu, mỗi tháng bạn cần tối thiểu bao nhiêu để yên tâm? Bạn chỉ cần ước chừng thôi, không cần kể từng khoản đâu."],
["Giải thích cơ chế theo chính sách; nhấn mạnh điểm mạnh: thu nhập tương xứng với nỗ lực.","Điểm mạnh của công việc này là thu nhập tương xứng với nỗ lực. Với chính sách thu nhập của Prudential, bạn có thể đạt mức thu nhập mình mong muốn, nhưng bạn sẽ cần đầu tư thời gian và công sức tương xứng."],
["Kiểm tra khả năng chuyển tiếp với mức chi ứng viên tự chọn; không thuyết phục chấp nhận rủi ro.","Nếu bạn muốn, mình cùng xem công việc này có đáp ứng được mức chi tiêu tối thiểu của bạn không nhé. Mục đích là để bạn có thêm thông tin trước khi quyết định. Bạn thấy vậy được không?"]],
n:"Minh bạch rằng thu nhập phụ thuộc kết quả. Chỉ nêu chính sách hỗ trợ đang áp dụng, từ nguồn chính thức.",
d:"Cơ chế thu nhập và chương trình hỗ trợ người mới (bản hiện hành). Không dùng hoàn cảnh tài chính để ép quyết định."
},
{id:28,g:4,q:"Tôi cần thu nhập ngay, không chờ được.",s:[
["Thấu hiểu áp lực tài chính hiện tại; không xem nhẹ.","Mình hiểu, khi đang cần thu nhập thì ai cũng muốn có kết quả sớm."],
["Hỏi mức độ cấp bách và mục tiêu tài chính ngắn hạn – dài hạn.","Bạn cần có thu nhập trong khoảng bao lâu nữa? Ngoài nhu cầu trước mắt, mục tiêu tài chính lâu dài của bạn là gì?"],
["Nói thật thu nhập cần thời gian; làm song song chỉ khi quỹ thời gian và rủi ro cho phép.","Nếu bạn cần thu nhập ngay, ưu tiên một công việc có thu nhập ổn định trước là hợp lý. Cơ hội này có thể làm song song khi bạn sắp xếp được thời gian và sẵn sàng cho giai đoạn đầu."],
["Tóm tắt 4 điểm vừa cùng kiểm tra: quỹ thời gian, việc hiện tại, yêu cầu đào tạo, giai đoạn chưa có thu nhập; chốt bằng câu hỏi mở.","(Sau khi cùng xem xét) Chúng ta vừa cùng xem quỹ thời gian, việc hiện tại, yêu cầu đào tạo và giai đoạn đầu chưa có thu nhập. Bạn còn cần thêm thông tin gì để cân nhắc không?"]],
n:"Trung thực là cách xây niềm tin nhanh nhất. Không dùng hoàn cảnh khó khăn của ứng viên để thúc ép quyết định.",
d:"Yêu cầu đào tạo, yêu cầu hoạt động, cơ chế thu nhập hiện hành."
},
{id:29,g:4,q:"Tôi sợ áp lực doanh số, chỉ tiêu.",s:[
["Công nhận lo ngại áp lực là phổ biến với người chưa quen kinh doanh.","Mình hiểu, áp lực chỉ tiêu thường là điều nhiều người lo đầu tiên."],
["Hỏi kinh nghiệm với chỉ tiêu và điều giúp ứng viên làm việc tốt nhất.","Bạn đã từng làm việc có chỉ tiêu chưa? Điều gì giúp bạn làm tốt nhất: mục tiêu rõ ràng, có người hỗ trợ hay tự mình chủ động?"],
["Không gọi áp lực bằng tên khác; minh bạch yêu cầu, chu kỳ đánh giá, hỗ trợ và hệ quả khi chưa đạt.","Công việc nào cũng có mục tiêu kết quả, và ở đây cũng vậy. Đây là yêu cầu chính thức, cách theo dõi, mình hỗ trợ gì khi bạn chưa đạt, và chính sách áp dụng ra sao."],
["Tóm tắt yêu cầu chính thức, kỳ vọng của nhóm và kế hoạch tuần mẫu; chốt bằng câu hỏi mở.","(Sau khi cùng xem) Chúng ta vừa cùng xem yêu cầu chính thức, kỳ vọng của nhóm và kế hoạch hoạt động tuần mẫu. Bạn còn băn khoăn điều gì nữa không?"]],
n:"Không nói “không có áp lực”. Giúp ứng viên thấy áp lực được chia nhỏ và có hỗ trợ.",
d:"Yêu cầu hoạt động/kết quả, chu kỳ đánh giá, hệ quả theo chính sách."
},
{id:30,g:4,q:"Thu nhập nghe hấp dẫn quá, khó tin.",s:[
["Khen sự tỉnh táo; hoài nghi là cần thiết khi cân nhắc nghề mới.","Bạn nghĩ như vậy là rất tỉnh táo. Mình cũng muốn bạn quyết định dựa trên thông tin thật."],
["Hỏi ứng viên nghe thông tin từ đâu và điều gì khiến khó tin.","Bạn nghe con số đó ở đâu? Điều gì khiến bạn thấy khó tin nhất?"],
["Không lấy trường hợp cao nhất làm kỳ vọng; chỉ dùng cơ chế và dữ liệu chính thức được công bố.","Thu nhập ở đây được tính theo cơ chế rõ ràng, không lấy trường hợp cao nhất làm chuẩn. Mình chia sẻ cách tính thu nhập và những số liệu chính thức được phép công bố để bạn tự đánh giá nhé."],
["Tóm tắt trên tài liệu: thành phần, điều kiện ghi nhận, thời điểm chi trả, chi phí tự chịu; chốt bằng câu hỏi mở.","(Sau khi cùng xem tài liệu) Chúng ta vừa cùng xem thu nhập gồm những phần nào, điều kiện ghi nhận, thời điểm chi trả và chi phí bạn tự chịu. Bạn có muốn tự tính thử, hay cần thêm thông tin gì không?"]],
n:"Tuyệt đối không dùng con số thu nhập “điển hình” hay “cao nhất” để thu hút. Sự minh bạch giúp ứng viên tin hơn.",
d:"Cơ chế thu nhập chính thức: thành phần, điều kiện ghi nhận, thời điểm chi trả, khoản có thể thay đổi."
}
];

/* ===== SELF STUDY – linear ===== */
const SRS_KEY="xltc_srs_v2";
let srs = LS.get(SRS_KEY,{cards:{}});
const saveSrs = () => LS.set(SRS_KEY, srs);
const DAY=864e5;
function deckStat(g){ const now=Date.now(); let due=0,nw=0; CARDS.forEach(c=>{ if(g&&c.g!==g) return; const s=srs.cards[c.id]; if(!s) nw++; else if(s.due<=now) due++; }); return {due,nw}; }
function sched(p, r){
  const s = p?{...p}:{r:0,i:0,e:2.5,due:0};
  if(r===1){ s.r=0; s.i=0; s.e=Math.max(1.3,s.e-.2); s.due=Date.now()+60e3; }
  else if(r===2){ s.i=s.r===0?1:Math.max(1,Math.round(s.i*1.2)); s.e=Math.max(1.3,s.e-.15); s.r++; s.due=Date.now()+s.i*DAY; }
  else if(r===3){ s.i=s.r===0?1:s.r===1?3:Math.round(Math.max(1,s.i)*s.e); s.r++; s.due=Date.now()+s.i*DAY; }
  else { s.i=s.r===0?3:s.r===1?6:Math.round(Math.max(1,s.i)*s.e*1.3); s.e+=.15; s.r++; s.due=Date.now()+s.i*DAY; }
  return s;
}

function studyCount(_, isBack){

    <ol><li>Đọc câu băn khoăn của ứng viên.</li><li><b>Nói thành tiếng</b> cách xử lý theo 4 bước.</li><li>Lật thẻ, đối chiếu lời thoại mẫu.</li><li>Tự chấm: <b style="color:#B5121F">Học lại</b> · <b style="color:#9A5B00">Khó</b> · <b style="color:#14713F">Tốt</b> · <b style="color:#0A66C2">Dễ</b>.</li></ol></div>`, isBack);
  dock(`<button class="btn b-pri full" id="go">${SV.play} Bắt đầu ôn</button>`);
  $("#go").onclick=startStudy;
}
function startStudy(){
  const now=Date.now(), pool=CARDS.filter(c=>!S.g||c.g===S.g);
  const due=shuffle(pool.filter(c=>srs.cards[c.id]&&srs.cards[c.id].due<=now));
  const nw=pool.filter(c=>!srs.cards[c.id]);
  const rest=pool.filter(c=>srs.cards[c.id]&&srs.cards[c.id].due>now).sort((a,b)=>srs.cards[a.id].due-srs.cards[b.id].due);
  const q=due.concat(nw,rest).slice(0,S.n).map(c=>c.id);
  Object.assign(S,{q,idx:0,done:0,total:q.length,cnt:{1:0,2:0,3:0,4:0}});
  stack=[[home]]; go(studyCard);
}
function studyCard(_, isBack){
  if(S.idx>=S.q.length){ stack.pop(); return go(studyDone); }

  setBar(`Thẻ ${S.done+1}/${S.total}`, "Nói thành tiếng, rồi lật thẻ", {onBack:()=>{ if(confirm("Kết thúc phiên ôn?")){ stack.pop(); S.done?go(studyDone):reset(home); } }, home:false});

  $("#fB").onclick=flip;

function flip(){
  const f=$("#flp"); if(!f||f.dataset.flipped) return; f.dataset.flipped=1;
  const c=byId(S.q[S.idx]);

/* PNG */
function wrap(ctx, text, maxW){ const out=[]; String(text).split("\n").forEach(par=>{ const words=par.split(/\s+/).filter(Boolean); let line=""; words.forEach(w=>{ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; }); out.push(line); }); return out; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function makePng(){
  const c=T.card, G=GCOLOR[c.g], {s,lv}=scoreOf(), W=1080, P=64, F="Arial, Helvetica, sans-serif";
  const cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  ctx.font=`bold 50px ${F}`; const qL=wrap(ctx,`“${c.q}”`,W-2*P-40);
  ctx.font=`30px ${F}`; const nL=T.fb.note?wrap(ctx,T.fb.note,W-2*P-72):[];
  const headH=230+qL.length*64+60, fbH=nL.length?110+nL.length*42:0;
  const H=headH+220+4*112+fbH+170;
  cv.width=W; cv.height=H;
  ctx.fillStyle="#F5F5F7"; ctx.fillRect(0,0,W,H);
  const gr=ctx.createLinearGradient(0,0,W,headH); gr.addColorStop(0,G.c); gr.addColorStop(1,G.d); ctx.fillStyle=gr; ctx.fillRect(0,0,W,headH);
  ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(W-40,30,190,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(W-40,30,120,0,Math.PI*2); ctx.fillStyle="rgba(255,255,255,.07)"; ctx.fill();
  ctx.fillStyle="#fff"; rr(ctx,P,56,560,54,27); ctx.fill();
  ctx.fillStyle=G.c; ctx.font=`bold 24px ${F}`; ctx.textBaseline="middle"; ctx.fillText("HIỂU ĐIỀU ỨNG VIÊN BĂN KHOĂN",P+30,84);
  ctx.fillStyle="rgba(255,255,255,.9)"; ctx.font=`bold 26px ${F}`; ctx.fillText(`TỔNG KẾT ĐỐI LUYỆN · TÌNH HUỐNG ${pad(c.id)} · NHÓM ${c.g}`,P,150);
  ctx.fillStyle="#fff"; ctx.font=`bold 50px ${F}`; ctx.textBaseline="alphabetic";
  qL.forEach((l,i)=>ctx.fillText(l,P+26,250+i*64)); ctx.fillRect(P,202,6,qL.length*64);
  let y=headH-40; ctx.fillStyle="#fff"; ctx.shadowColor="rgba(0,0,0,.08)"; ctx.shadowBlur=30; rr(ctx,P,y,W-2*P,200,36); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle="#1D1D1F"; ctx.font=`bold 110px ${F}`; ctx.fillText(String(s),P+50,y+142); const sw=ctx.measureText(String(s)).width;
  ctx.fillStyle="#8A8D93"; ctx.font=`bold 46px ${F}`; ctx.fillText("/8",P+56+sw,y+142);
  ctx.fillStyle=G.c; ctx.font=`bold 44px ${F}`; ctx.fillText(lv[0],P+300,y+92);
  ctx.fillStyle="#6E6E73"; ctx.font=`30px ${F}`; ctx.fillText(lv[1],P+300,y+140);
  if(T.fb.ql){ ctx.font=`26px ${F}`; ctx.fillText("Quản lý TVV: "+T.fb.ql,P+300,y+180); }
  y+=240;
  STEPS.forEach((st,i)=>{ const m=MARK[T.marks[i]];
    ctx.fillStyle="#fff"; rr(ctx,P,y,W-2*P,96,28); ctx.fill();
    ctx.fillStyle=G.c; ctx.beginPath(); ctx.arc(P+52,y+48,24,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font=`bold 26px ${F}`; ctx.textAlign="center"; ctx.fillText(String(i+1),P+52,y+57); ctx.textAlign="left";
    ctx.fillStyle="#1D1D1F"; ctx.font=`bold 34px ${F}`; ctx.fillText(st.name,P+96,y+60);
    ctx.font=`bold 27px ${F}`; const tw=ctx.measureText(m.t).width+48; const bx=W-P-24-tw;
    ctx.fillStyle=m.bg; rr(ctx,bx,y+24,tw,48,24); ctx.fill(); ctx.fillStyle=m.col; ctx.fillText(m.t,bx+24,y+58);
    y+=112; });
  if(nL.length){ y+=20; ctx.fillStyle="#fff"; rr(ctx,P,y,W-2*P,fbH-20,28); ctx.fill(); let yy=y+56;
    ctx.fillStyle="#8A8D93"; ctx.font=`bold 22px ${F}`; ctx.fillText("GHI CHÚ",P+36,yy); yy+=44;
    ctx.fillStyle="#1D1D1F"; ctx.font=`30px ${F}`; nL.forEach(l=>{ ctx.fillText(l,P+36,yy); yy+=42; }); }
  y=H-110; ctx.fillStyle="#ED1B2E"; ctx.font=`bold 28px ${F}`; ctx.fillText("PRUDENTIAL",P,y+40);
  ctx.fillStyle="#8A8D93"; ctx.font=`24px ${F}`; ctx.textAlign="right";
  const d=new Date(); ctx.fillText(`Hiểu điều ứng viên băn khoăn · ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} · ${T.mins} phút`,W-P,y+40); ctx.textAlign="left";
  return new Promise(res=>cv.toBlob(b=>res(b),"image/png"));
}
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const f=$("#flp");
  if(f&&!f.dataset.flipped&&(e.code==="Space"||e.key==="Enter")){ e.preventDefault(); flip(); }
  else if(f&&f.dataset.flipped&&/^[1-4]$/.test(e.key)) rate(+e.key);
});
reset(home);
})();
